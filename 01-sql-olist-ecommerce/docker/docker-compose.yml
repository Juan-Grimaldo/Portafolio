services:
  db:
    image: postgres:16-alpine
    container_name: olist_pg
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
      POSTGRES_DB: olist
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../data:/data:ro
      - ../sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d olist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
